<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GIF Panel</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a08;
    color: #cfcfcf; font: 12px "Segoe UI", Arial, sans-serif; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #0c0a08; }
  #stage.drag { outline: 2px dashed #8a7f78; outline-offset: -6px; }
  #gif { width: 100%; height: 100%; object-fit: contain; display: none; }
  #hint { color: #6f6a66; }

  /* Стеклянная кнопка в стиле iOS (Liquid Glass): полупрозрачная, с размытием фона */
  #replace {
    position: absolute; left: 50%; bottom: 14px;
    transform: translate(-50%, 8px) scale(.96);
    padding: 0 22px; height: 34px; border-radius: 17px;
    color: #fff; font: 500 12px "Segoe UI", Arial, sans-serif; letter-spacing: .2px;
    cursor: pointer; white-space: nowrap;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.10));
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55),
                inset 0 -1px 0 rgba(255,255,255,.08),
                0 6px 20px rgba(0,0,0,.35);
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
    /* скрыта, пока не навёл курсор */
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease, background .15s ease;
  }
  /* появляется, когда курсор над панелью */
  body:hover #replace { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
  #replace:hover { background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.16)); }
  #replace:active { transform: translate(-50%, 0) scale(.97);
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); }
  /* пока GIF не выбран, кнопка видна всегда */
  body.empty #replace { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
</style>
</head>
<body class="empty">
  <div id="stage">
    <div id="hint">Перетащи GIF сюда</div>
    <img id="gif" alt="">
  </div>
  <button id="replace">Заменить GIF</button>

<script>
(function () {
  var stage = document.getElementById("stage");
  var img = document.getElementById("gif");
  var hint = document.getElementById("hint");

  function toFileUrl(p) {
    p = p.replace(/\\/g, "/");
    if (p.charAt(0) !== "/") p = "/" + p; // C:/... -> /C:/...
    return "file://" + encodeURI(p).replace(/#/g, "%23");
  }

  function showGif(path) {
    img.src = toFileUrl(path) + "?t=" + Date.now(); // ?t= чтобы GIF перезапускался
    img.style.display = "block";
    hint.style.display = "none";
    document.body.classList.remove("empty");
    try { localStorage.setItem("lastGif", path); } catch (e) {}
  }

  function pickFile() {
    if (!window.cep || !window.cep.fs) return;
    var r = window.cep.fs.showOpenDialogEx(false, false, "Выбери GIF", "", ["gif"], "", "Выбрать");
    if (r && r.err === 0 && r.data && r.data.length) showGif(r.data[0]);
  }

  document.getElementById("replace").addEventListener("click", pickFile);

  // Перетаскивание файла на панель
  ["dragenter", "dragover"].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.remove("drag"); });
  });
  stage.addEventListener("drop", function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.path && /\.gif$/i.test(f.path)) showGif(f.path);
  });

  // Вспомнить последний GIF
  try {
    var last = localStorage.getItem("lastGif");
    if (last && window.cep && window.cep.fs && window.cep.fs.stat(last).err === 0) showGif(last);
  } catch (e) {}
})();
</script>
</body>
</html>
